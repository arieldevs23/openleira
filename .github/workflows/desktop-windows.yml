name: Windows installer

# Builds OpenLeira-Setup-<version>.exe on a Windows machine: the server and its
# native modules have to be compiled for Windows, so this cannot be done from
# Linux. Runs by hand, on version tags (and attaches the installer to the
# release), and when the desktop shell or its build scripts change. A manual
# run with `release_tag` (e.g. v1.37.4) creates that tag and release too.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create, e.g. v1.37.4 (empty = build only)'
        required: false
        default: ''
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - 'electron/**'
      - 'scripts/release/**'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      HUSKY: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The tag being released: the pushed tag, or the manual run's input.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build the Windows server bundle (native modules for Electron)
        run: node scripts/release/build-server-bundle.js

      - name: Stage the desktop app with the server inside
        shell: bash
        run: |
          BUNDLE=$(ls release/local-server/*.tar.gz | head -n 1)
          echo "Embedding $BUNDLE"
          OPENLEIRA_EMBED_SERVER_BUNDLE="$BUNDLE" node scripts/release/prepare-desktop-app.js

      - name: Build the installer
        run: npx electron-builder --projectDir .desktop-build/desktop-app --win nsis --x64 --publish never

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenLeira-Windows-Setup
          path: release/desktop/*.exe
          if-no-files-found: error

      # A copy under a fixed name, so https://github.com/<repo>/releases/latest/download/OpenLeira-Setup.exe
      # (the landing page's download button) always serves the newest installer.
      - name: Add the fixed-name copy
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          mkdir -p release/stable
          cp release/desktop/OpenLeira-Setup-*.exe release/stable/OpenLeira-Setup.exe

      - name: Attach to the release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: OpenLeira - Reaver4 ${{ env.RELEASE_TAG }}
          body: |
            Installer Windows OpenLeira - Reaver4 (${{ env.RELEASE_TAG }}).

            - **OpenLeira-Setup.exe**: installer terbaru (nama tetap, dipakai tombol download di landing page).
            - **OpenLeira-Setup-<versi>.exe**: file yang sama dengan nomor versi.

            Windows 10/11 64-bit. Installer belum ditandatangani: kalau muncul "Windows protected your PC", pilih More info lalu Run anyway. Panduan: https://github.com/arieldevs23/openleira/blob/main/docs/install-windows.md
          files: |
            release/desktop/*.exe
            release/stable/OpenLeira-Setup.exe
